<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qwen3 TTS Studio</title>
    <style>
      body { margin: 0; padding: 0; }
      #app { height: 100vh; }
      .loader {
        position: fixed; inset: 0; z-index: 9999; display: flex;
        justify-content: center; align-items: center; background: #f5f7fa;
        transition: opacity .3s ease;
      }
      .loader::after {
        content: ""; width: 42px; height: 42px;
        border: 5px solid #e0e7ff; border-top: 5px solid #6366f1;
        border-radius: 50%; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loaded .loader { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="loader"></div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => document.body.classList.add('loaded'), 300);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
